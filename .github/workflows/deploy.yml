name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # chaque lundi : recalcule les fiches « à actualiser »

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_docs.py --check
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - name: Version des fichiers CSS et JS (évite qu'un navigateur garde l'ancienne version en cache)
        run: sed -i "s#assets/style.css\"#assets/style.css?v=${GITHUB_SHA::7}\"#; s#assets/app.js\"#assets/app.js?v=${GITHUB_SHA::7}\"#" site/index.html && grep -o 'assets/[a-z]*\.[a-z]*?v=[0-9a-f]*' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
